<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="converter.css">
</head>
<body>
    <div class="container">
        <h1>Currency Converter</h1>
        
        <div class="converter-group">
            <label for="amount">Amount</label>
            <div class="input-wrapper">
                <input type="number" id="amount" placeholder="Enter amount" value="1" min="0" step="0.01">
                <select id="fromCurrency">
                    <option value="USD" selected>USD</option>
                    <option value="EUR">EUR</option>
                    <option value="GBP">GBP</option>
                    <option value="JPY">JPY</option>
                    <option value="AUD">AUD</option>
                    <option value="CAD">CAD</option>
                    <option value="CHF">CHF</option>
                    <option value="CNY">CNY</option>
                    <option value="INR">INR</option>
                    <option value="RWF">RWF</option>
                </select>
            </div>
        </div>

        <div class="swap-button">
            <button id="swapButton">⇅ Swap Currencies</button>
        </div>

        <div class="converter-group">
            <label for="convertedAmount">Converted Amount</label>
            <div class="input-wrapper">
                <input type="number" id="convertedAmount" placeholder="Result" readonly>
                <select id="toCurrency">
                    <option value="USD">USD</option>
                    <option value="EUR" selected>EUR</option>
                    <option value="GBP">GBP</option>
                    <option value="JPY">JPY</option>
                    <option value="AUD">AUD</option>
                    <option value="CAD">CAD</option>
                    <option value="CHF">CHF</option>
                    <option value="CNY">CNY</option>
                    <option value="INR">INR</option>
                    <option value="RWF">RWF</option>
                </select>
            </div>
        </div>

        <div class="rate-info" id="rateInfo">
            <strong>1 USD</strong> = <strong>0.92 EUR</strong>
        </div>
    </div>
</body>
</html>
